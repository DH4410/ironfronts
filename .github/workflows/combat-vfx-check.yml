name: Combat VFX prototype check
on:
  push:
    branches: [combat-vfx-prototype]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:world
      - name: Workspace checks
        run: npm run check --workspaces --if-present
      - name: Root TypeScript
        run: npx tsc --noEmit
      - run: npm run lint:scripts
      - run: npm run test:architecture
      - name: Combat and shader tests
        run: npx vitest run tests/combat-effects.test.ts tests/shaders.test.ts
      - name: Production build
        run: npm run build
